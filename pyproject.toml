[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "trajectoryshield-research"
version = "0.1.0"
description = "Inspectable policy checks over tool-action trajectories, with effect tracking and reproducible research examples."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Muhammad Meeran"}]
dependencies = ["pydantic>=2.6,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
judge = ["openai>=1", "anthropic>=0.18", "litellm>=1", "python-dotenv>=1"]
training = ["torch>=2.2", "transformers>=4.45,<5", "peft>=0.12", "trl>=0.12", "datasets>=3", "accelerate>=0.20"]
[project.scripts]
trajectoryshield = "trajectoryshield.cli:main"
[tool.setuptools.packages.find]
include = ["trajectoryshield*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
